      - 'heading "APR vs APY: What''s the Difference?" [level=1] [ref=f2e14]'
      - paragraph [ref=f2e15]: One is what you're charged; the other is what you earn. Here's how to convert between them and why it matters.
    - img "APR vs APY comparison with formula and real examples" [ref=f2e17]
    - generic [ref=f2e18]:
      - paragraph [ref=f2e20]:
        - text: Use our free
        - link "APY Calculator" [ref=f2e21] [cursor=pointer]:
          - /url: /calculators/apy-calculator
        - text: — convert any nominal rate to its true annual yield instantly.
      - paragraph [ref=f2e22]: APR and APY look almost identical on a bank statement or loan offer. But one number includes compounding and the other doesn't — and the difference can cost or earn you hundreds of dollars per year.
      - heading "The one-sentence difference" [level=2] [ref=f2e23]
      - paragraph [ref=f2e24]:
        - strong [ref=f2e25]: APR (Annual Percentage Rate)
        - text: is the simple annual rate. It doesn't account for compounding — interest charged or earned on interest.
      - paragraph [ref=f2e26]:
        - strong [ref=f2e27]: APY (Annual Percentage Yield)
        - text: is the true annual rate after compounding is included. It's always equal to or higher than the APR for the same nominal rate.
      - heading "APR → APY conversion formula" [level=2] [ref=f2e28]
      - strong [ref=f2e30]: APY = (1 + APR/n)ⁿ − 1
      - paragraph [ref=f2e31]: "Where n = number of compounding periods per year:"
      - list [ref=f2e32]:
        - listitem [ref=f2e33]:
          - strong [ref=f2e34]: n = 12
          - text: ": monthly compounding (most personal loans, mortgages)"
        - listitem [ref=f2e35]:
          - strong [ref=f2e36]: n = 365
          - text: ": daily compounding (high-yield savings, credit cards)"
        - listitem [ref=f2e37]:
          - strong [ref=f2e38]: n = 1
          - text: ": annual compounding (APY = APR, no difference)"
      - 'heading "Conversion table: APR → APY" [level=2] [ref=f2e39]'
