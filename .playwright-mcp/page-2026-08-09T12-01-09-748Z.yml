      - heading "The credit card trap" [level=2] [ref=f2e108]
      - paragraph [ref=f2e109]:
        - text: Credit cards advertise APR. But they compound
        - strong [ref=f2e110]: daily
        - text: ". A card with 24.99% APR that compounds daily has a true APY of 28.4%. If you carry a $5,000 balance:"
      - table [ref=f2e111]:
        - rowgroup [ref=f2e112]:
          - row [ref=f2e113]:
            - columnheader [ref=f2e114]
            - columnheader "As \"APR\" (incorrect)" [ref=f2e115]
            - columnheader "As \"APY\" (true cost)" [ref=f2e116]
        - rowgroup [ref=f2e117]:
          - row [ref=f2e118]:
            - cell "Annual interest on $5,000" [ref=f2e119]
            - cell "$1,249" [ref=f2e120]
            - cell "$1,420" [ref=f2e121]
      - paragraph [ref=f2e122]: The true cost is $171/year more than the APR suggests — and this compounds if you don't pay it off.
      - heading "The savings account reward" [level=2] [ref=f2e123]
      - paragraph [ref=f2e124]: "Two high-yield savings accounts, both advertising \"5.00%\":"
      - list [ref=f2e125]:
        - listitem [ref=f2e126]:
          - strong [ref=f2e127]: "Account A:"
          - text: 5.00% APY, compounded monthly
        - listitem [ref=f2e128]:
          - strong [ref=f2e129]: "Account B:"
          - text: 5.00% APY, compounded daily
      - paragraph [ref=f2e130]: "On a $10,000 balance: Account A earns $511.16/year; Account B earns $512.71/year. The difference is small ($1.55), but it compounds over multiple years — and comparing APY directly makes this comparison immediate without any calculation."
      - heading "APY → APR conversion formula" [level=2] [ref=f2e131]
      - strong [ref=f2e133]: APR = n × [(1 + APY)^(1/n) − 1]
      - paragraph [ref=f2e134]: "For a 5.00% APY compounded monthly: APR = 12 × [(1.05)^(1/12) − 1] ≈ 4.89%"
      - paragraph [ref=f2e136]:
        - strong [ref=f2e137]: "Use the Calculator:"
        - text: Try our
        - link "APY Calculator" [ref=f2e138] [cursor=pointer]:
          - /url: /calculators/apy-calculator
        - text: — enter any nominal rate and compounding frequency to get the true annual yield, or work backwards from an APY.
      - heading "Frequently asked questions" [level=2] [ref=f2e139]
      - generic [ref=f2e140]:
        - group [ref=f2e141]:
          - generic "What's the difference between APR and APY? –" [ref=f2e142] [cursor=pointer]
          - paragraph [ref=f2e143]: APR doesn't include compounding; APY does. For the same stated rate, APY is always higher than APR because it accounts for interest earned on interest. Savings products advertise APY (what you earn); loan products advertise APR (the base cost before compounding effects).
