<body>
  <section class="blog-hero">
    <div class="container">
      <span class="eyebrow reveal">Decision guides for India</span>
      <h1 class="reveal d1 mt-2">Less confusion. <span class="hl">Better next moves.</span></h1>
      <p class="lead reveal d2">Clear, number-led explainers for the money and life decisions that matter. Read the guide, use the calculator, decide with confidence.</p>
      <label class="blog-search reveal d3" aria-label="Search articles"><span id="searchIcon"></span><input id="blogSearch" type="search" placeholder="Search guides: EMI, insurance, rent or buy…"></label>
    </div>
  </section>

  <main class="container section">
    <div class="center mb-4 reveal">
      <span class="eyebrow">Featured guides</span>
      <h2 class="mt-2">Read it. <span class="gradient-text">Calculate it.</span> Act on it.</h2>
    </div>
    <div class="blog-grid" id="blogGrid"></div>
    <script src="/assets/js/blog-data.js?v=20260914-1"></script>
    <script>
      /* Blog grid renders from DC.blogPosts (assets/js/blog-data.js),
         newest first. To publish a new guide: add its entry to that file. */
      (function () {
        const grid = document.getElementById("blogGrid");
        grid.innerHTML = DC.blogPosts.map(function (p) {
          return '<article class="card blog-card reveal d0" data-search="' + p.search + '">' +
            '<div class="blog-card-top"><img src="' + p.img + '" alt="' + p.alt + '" loading="lazy" width="1536" height="1024" style="width:100%;height:auto;aspect-ratio:3/2;object-fit:cover;display:block"></div>' +
            '<div class="blog-card-body"><div class="blog-meta"><span>' + p.cat + '</span><span class="dot"></span><span>' + p.read + '</span></div>' +
            '<h2>' + p.title + '</h2><p>' + p.desc + '</p>' +
            '<a class="blog-read" href="/blog/' + p.slug + '">Read the guide →</a></div></article>';
        }).join("");
      })();
    </script>
  </div>
  </main>

  <script src="/assets/js/core.js?v=20260911-1"></script>
  <script src="/assets/js/layout.js?v=20260911-1"></script>
  <script src="/assets/js/ads.js?v=20260911-1"></script>
  <script>
    DC.renderLayout();
    document.getElementById('searchIcon').innerHTML = DC.icon('search');
    document.getElementById('blogSearch').addEventListener('input', function () {
      const q = this.value.trim().toLowerCase();
      document.querySelectorAll('#blogGrid .blog-card').forEach(function (card) {
        card.style.display = !q || card.getAttribute('data-search').indexOf(q) !== -1 ? '' : 'none';
      });
    });
    setTimeout(function () { DC.initReveal(); }, 0);
  </script>
